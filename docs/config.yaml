# Clawdbot Trader frontend configuration

markets:
  us:
    name: "US Market (Nasdaq-100)"
    subtitle: "Track how different AI models perform in Nasdaq-100 stock trading"
    data_dir: "agent_data"
    benchmark_file: "Adaily_prices_QQQ.json"
    benchmark_name: "QQQ"
    benchmark_display_name: "QQQ Invesco"
    currency: "USD"
    icon: "US"
    price_data_type: "individual"
    time_granularity: "hourly"
    enabled: true
    agents:
      - folder: "claude-3.7-sonnet"
        display_name: "Claude 3.7 Sonnet"
        icon: "./figs/claude-color.svg"
        color: "#8338ec"
        enabled: true
      - folder: "deepseek-chat-v3.1"
        display_name: "DeepSeek Chat v3.1"
        icon: "./figs/deepseek.svg"
        color: "#ff006e"
        enabled: true
      - folder: "gpt-4o"
        display_name: "GPT-4o"
        icon: "./figs/openai.svg"
        color: "#10a37f"
        enabled: false
      - folder: "gpt-4o-mini"
        display_name: "GPT-4o Mini"
        icon: "./figs/openai.svg"
        color: "#10a37f"
        enabled: true

data:
  base_path: "./data"
  price_file_prefix: "daily_prices_"
  benchmark_file: "Adaily_prices_QQQ.json"

benchmark:
  folder: "QQQ"
  display_name: "QQQ Invesco"
  icon: "./figs/stock.svg"
  color: "#ff6b00"
  enabled: true

chart:
  default_scale: "linear"
  max_ticks: 15
  point_radius: 0
  point_hover_radius: 7
  border_width: 3
  tension: 0.42

ui:
  initial_value: 10000
  max_recent_trades: 20
  date_formats:
    hourly: "MM/DD HH:mm"
    daily: "YYYY-MM-DD"

cache:
  enabled: true
  max_age_days: 7
  show_performance_metrics: true
